<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stop-watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stop-watch">
        <h1 id="displayTime">00:00:00</h1>
        <div class="button">
            <img onclick="watchStop()" src="images/stop.png" alt="stop">
            <img onclick="watchStart()" src="images/start.png" alt="stop">
            <img onclick="watchReset()" src="images/reset.png" alt="stop">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
